server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sem isso, o navegador recusa WebAssembly.compileStreaming() com um
    # erro de MIME type incorreto — o carregamento do módulo WASM falha
    # silenciosamente dentro do Web Worker (ver docs/DECISIONS.md).
    types {
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
